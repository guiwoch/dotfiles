[main]
font = JetBrains Mono:size=14

fuzzy = true
fuzzy-sort = true

icon-theme = Papirus

lines = 10
width = 50
horizontal-pad = 20
vertical-pad = 10
inner-pad = 10
border-radius = 12

layer = overlay
anchor = center
term = foot

[colors]
background = 2b2b2bff        # semi-transparent dark grey
text = ffffffff               # light grey text
match = f0f0f0ff              # slightly brighter for matched text
selection = 444444ff          # medium grey selection
selection-text = ffffffff     # white text on selected line
border = 5a5a5aff             # subtle darker border
prompt = ccccccff             # grey prompt color
input = e0e0e0ff              # input text color

[border]
width = 2
radius = 5

[dmenu]
case-sensitive = no
