enable_kitty_graphics
# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME

disable_ligatures = always

# -------------------------
# Font
# -------------------------
font_family JetBrains Mono Nerd
font_size   12
window_padding_width 4

# -------------------------
# Mouse
# -------------------------
mouse_hide_wait 3.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# -------------------------
# Copy & Paste behavior
# -------------------------
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# -------------------------
# Word navigation / deletion 
# -------------------------
map ctrl+backspace send_text all \x17
map ctrl+left  send_text all \x1bb
map ctrl+right send_text all \x1bf

# -------------------------
# Scrolling
# -------------------------
# Use Ctrl+U / Ctrl+D for paging
map ctrl+u scroll_page_up
map ctrl+d scroll_page_down

# Mouse wheel scrolls the buffer.
# If an application (like vim or zsh with mouse enabled) grabs the mouse,
# hold SHIFT while scrolling to force kitty to scroll the buffer.

