#################
### VARIABLES ###
#################

$mainMod = ALT
$terminal = wezterm
$fileManager = nautilus --new-window --no-desktop
$menu = fuzzel
$scriptsFolder = ~/.config/hypr/scripts/

################
### MONITORS ###
################

monitor = DP-1,2560x1080@75,auto,1

#################
### AUTOSTART ###
#################

exec-once = clipse -listen
exec-once = waybar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Google Drive mount
exec-once = rclone mount GoogleDrive: ~/googleDrive \
  --vfs-cache-mode full \
  --vfs-cache-max-size 4G \
  --dir-cache-time 96h \
  --poll-interval 15s \
  --buffer-size 256M \
  --transfers 8 \
  --daemon

# KDE file associations fix
env = XDG_MENU_PREFIX,arch-
exec-once = kbuildsycoca6

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1

    col.active_border = rgba(3C3C3Cff)
    col.inactive_border = rgba(131313ff)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = 0
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
}

group {
    col.border_active = rgba(5C5C5Cff) rgba(8C8C8Cff)
    col.border_inactive = rgba(2C2C2Cff)

    groupbar {
        enabled = true
        font_family = Iosevka
        font_size = 10
        gradients = true
        height = 12
        render_titles = true
        scrolling = true
        text_color = rgba(CCCCCCff)
        
        gaps_in = 0
        gaps_out = 0
        col.active = rgba(3C3C3Cff)
        col.inactive = rgba(131313ff)
        col.locked_active = rgba(5C5C5Cff)
        col.locked_inactive = rgba(2C2C2Cff)
    }
}

##############
### CURSOR ###
##############

cursor {
    no_warps = true
    inactive_timeout = 1
}

##############
### INPUT ###
##############

input {
    kb_layout = us

    accel_profile = flat
    sensitivity = 0

    follow_mouse = 1
    mouse_refocus = true

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

####################
### WORKSPACES ###
####################

workspace = w[tv1], bordersize:0
workspace = f[1], bordersize:0
windowrule = border_size 0, match:workspace w[tv1]

#Not in use anymore, workspace 2 sizing
# workspace = 2, layoutopt:master:true
# workspace = 2, layoutopt:orientation:center
# workspace = 2, layoutopt:master_width:0.75
# workspace = 2, gapsout:1 320 0 320

####################
### WINDOW RULES ###
####################

# Polkit agent
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = center on, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = size 400 200, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = dim_around on, match:class ^(polkit-gnome-authentication-agent-1)$

# Clipboard manager (Clipse)
windowrule = float on, match:class ^clipse$
windowrule = pin on, match:class ^clipse$
windowrule = center on, match:class ^clipse$
windowrule = size 622 652, match:class ^clipse$

# General rules
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

###################
### KEYBINDINGS ###
###################

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, exec, $scriptsFolder/copy-from-clipboard-manager.sh

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r

bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, semicolon, layoutmsg, togglesplit
bind = $mainMod, T, exec, $scriptsFolder/toggle_resolution.sh

bind = $mainMod, space, exec, ~/.config/hypr/scripts/keyboard-layout-change.sh

bind = $mainMod, g, exec, flameshot gui --clipboard --path ~/Pictures/Screenshots/ --accept-on-select
bind = $mainMod SHIFT, g, exec, flameshot gui

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Groups
bind = $mainMod, U, togglegroup,
bind = $mainMod, M, changegroupactive, b
bind = $mainMod, comma, changegroupactive, f
bind = $mainMod, I, lockactivegroup, toggle
bind = $mainMod SHIFT, U, moveoutofgroup,
bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, J, moveintogroup, d

bind = $mainMod, semicolon, exec, $scriptsFolder/volume.py

#######################
### MEDIA / HARDWARE ###
#######################

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

#################
### THEME ###
#################

exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

exec-once = sleep 2 && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
