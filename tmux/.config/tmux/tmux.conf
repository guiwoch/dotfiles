# ─── prefix ────────────────────────────────────────────────────────────────
# C-b is what the Corne's prefix key (layer 1 + A) sends; keep them in sync.
set -g prefix C-b
bind C-b send-prefix

# ─── terminal / colors ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# nvim wants these: no escape lag, and :checktime on focus
set -sg escape-time 10
set -g focus-events on

# ─── general ───────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"

# ─── bindings ──────────────────────────────────────────────────────────────
# Deliberately stock. Windows are prefix 1-9 / n / p / l, panes are % and ",
# copy mode is [ - so `prefix ?`, the man page and every tutorial describe
# this tmux. The only changes are ones with no stock equivalent.

# Same keys as upstream, but inherit the cwd instead of starting at $HOME.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Overrides refresh-client, which is near enough to never used.
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ─── pane navigation: C-h/j/k/l, shared with nvim ──────────────────────────
# vim-tmux-navigator. When a vim owns the pane the key is forwarded to it and
# nvim moves between its own splits; otherwise tmux moves between panes. One
# set of keys for both, which is why this is worth not being stock.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ─── copy mode: vi keys, wayland clipboard ─────────────────────────────────
# Enter with the stock `prefix [`.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ─── theme: Gruber Darker ──────────────────────────────────────────────────
# Matches nvim's own chrome so the two statuslines read as one bar. Values are
# the palette keys from
# nvim-lazy/.config/nvim/vendors/gruber-darker.nvim/lua/gruber-darker/palette.lua
# - that file is the source of truth for the theme; keep these in sync with it.
# Hex rather than colourN because bg+1 (#282828) is not in the terminal's
# 16-color palette at all.
set -g status-position bottom
set -g status-style "bg=#282828 fg=#ffffff"                    # StatusLine
set -g status-left "#[fg=#ffdd33,bold] #S #[default]"          # yellow accent
set -g status-left-length 30
set -g status-right "#[fg=#95a99f]%H:%M #[fg=#cc8c3c]%d/%m "   # quartz, brown
setw -g window-status-current-format "#[fg=#ffdd33,bold] #I:#W "
setw -g window-status-format "#[fg=#95a99f] #I:#W "            # StatusLineNC
set -g window-status-separator ""

set -g pane-border-style "fg=#453d41"                          # WinSeparator
set -g pane-active-border-style "fg=#484848"                   # bg+3
set -g mode-style "bg=#453d41"                                 # Visual
set -g copy-mode-match-style "fg=#565f73 bg=#f4f4ff"           # Search
set -g copy-mode-current-match-style "fg=#000000 bg=#f5f5f5"   # IncSearch
set -g message-style "bg=#282828 fg=#ffdd33"
set -g clock-mode-colour "#ffdd33"
