# ─── prefix ────────────────────────────────────────────────────────────────
# C-b is what the Corne's prefix key (layer 1 + A) sends; keep them in sync.
set -g prefix C-b
bind C-b send-prefix

# ─── terminal / colors ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# nvim wants these: no escape lag, and :checktime on focus
set -sg escape-time 10
set -g focus-events on

# ─── general ───────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"

# ─── bindings ──────────────────────────────────────────────────────────────
# Deliberately stock. Windows are prefix 1-9 / n / p / l, panes are % and ",
# copy mode is [ - so `prefix ?`, the man page and every tutorial describe
# this tmux. The only changes are ones with no stock equivalent.

# Same keys as upstream, but inherit the cwd instead of starting at $HOME.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Overrides refresh-client, which is near enough to never used.
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# A session per directory you work in, picked by fuzzy search over zoxide's
# list (scripts/tmux-sessionizer.sh, linked as ~/.local/bin/tmux-sessionizer).
# Stock `prefix s` only shows sessions that already exist - this is how they
# come into being, so it duplicates nothing. `prefix f` stays find-window.
bind C-f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

# ─── pane navigation: C-h/j/k/l, shared with nvim ──────────────────────────
# smart-splits.nvim. When nvim owns the pane the key is forwarded to it and nvim
# moves between its own splits, handing the key back to tmux at its edge;
# otherwise tmux moves between panes. One set of keys for both, which is why
# this is worth not being stock (as is the C-v paste below).
#
# @pane-is-vim is a pane-local option the plugin sets on load and clears when
# nvim exits or suspends - which is why it is not lazy-loaded (see
# nvim/lua/plugins/tmux.lua). fzf is tested separately so its own C-j/C-k keep
# working in pickers like cliphist-fzf; nvim used to be detected the same way,
# by process name, which the plugin's option does more reliably.
is_vim="#{||:#{@pane-is-vim},#{==:#{pane_current_command},fzf}}"
bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ─── copy mode: vi keys, wayland clipboard ─────────────────────────────────
# Enter with the stock `prefix [`.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ─── C-v: paste at the shell, passthrough to full-screen apps ──────────────
# Replaces the wezterm paste_or_passthrough callback. TUIs run on the alternate
# screen, so that is the signal for "an app wants the keystroke" - nvim keeps
# visual-block and quoted-insert, the shell gets a plain paste. Copy mode has
# its own C-v (rectangle-toggle) and is untouched, since -n binds the root
# table only.
bind -n C-v if-shell -F '#{alternate_on}' \
  'send-keys C-v' \
  'run-shell "wl-paste -n | tmux load-buffer -b sysclip - && tmux paste-buffer -b sysclip -d -p"'

# ─── theme: Gruber Darker ──────────────────────────────────────────────────
# Matches nvim's own chrome so the two statuslines read as one bar. Values are
# the palette keys from
# nvim-lazy/.config/nvim/vendors/gruber-darker.nvim/lua/gruber-darker/palette.lua
# - that file is the source of truth for the theme; keep these in sync with it.
# The bar takes the editor/terminal background (bg, #181818) rather than
# StatusLine's bg+1 so it blends into the line above it instead of reading as
# a separate lighter block.
set -g status-position bottom
set -g status-style "bg=#181818 fg=#ffffff"                    # bg
set -g status-left "#[fg=#ffdd33,bold] #S #[default]"          # yellow accent
set -g status-left-length 30
set -g status-right "#[fg=#95a99f]%H:%M #[fg=#cc8c3c]%d/%m "   # quartz, brown
setw -g window-status-current-format "#[fg=#ffdd33,bold] #I:#W "
setw -g window-status-format "#[fg=#95a99f] #I:#W "            # StatusLineNC
set -g window-status-separator ""

set -g pane-border-style "fg=#453d41"                          # WinSeparator
set -g pane-active-border-style "fg=#484848"                   # bg+3
set -g mode-style "bg=#453d41"                                 # Visual
set -g copy-mode-match-style "fg=#565f73 bg=#f4f4ff"           # Search
set -g copy-mode-current-match-style "fg=#000000 bg=#f5f5f5"   # IncSearch
set -g message-style "bg=#181818 fg=#ffdd33"
set -g clock-mode-colour "#ffdd33"

# ─── plugins: sessions that survive a reboot ───────────────────────────────
# The one place where near-stock loses: nothing in tmux remembers your windows,
# panes and directories across a restart. resurrect saves them, continuum saves
# every 15 minutes on its own and restores when the server starts, so an
# attach after a reboot lands where you left off.
#
# TPM would otherwise install plugins next to this file, i.e. inside the
# dotfiles repo once ~/.config/tmux is a symlink into it. Keep clones out.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# TPM installs itself on first launch, so a fresh machine needs no extra step.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# nvim and ssh are worth bringing back; claude is not, since it would come back
# as a new conversation anyway.
set -g @resurrect-processes 'nvim ssh'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep last: tpm reads the settings above.
run '~/.tmux/plugins/tpm/tpm'
