# ─── prefix ────────────────────────────────────────────────────────────────
# Change this one line if C-a fights something. Default upstream is C-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── terminal / colors ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# nvim wants these: no escape lag, and :checktime on focus
set -sg escape-time 10
set -g focus-events on

# ─── general ───────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"

# ─── windows = your tabs ───────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-h previous-window
bind -n M-l next-window

# ─── splits (keep cwd) ─────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── copy mode: vi keys, wayland clipboard ─────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ─── reload ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ─── status bar ────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=default fg=#7aa2f7"
set -g status-left "#[fg=#bb9af7,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M #[fg=#7aa2f7]%d/%m "
setw -g window-status-current-format "#[fg=#7aa2f7,bold][#I:#W]"
setw -g window-status-format "#[fg=#565f89] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
